[project]
name = "fcoh-prototype"
version = "0.1.0"
description = "FCOH 0.3 prototype: local MCP and FreeCAD/Fusion adapters"
requires-python = ">=3.11"
dependencies = ["mcp==2.2.0", "PyYAML==6.0.3", "jsonschema==4.26.0"]

[project.scripts]
fcoh = "fcoh.cli:main"
fcoh-mcp = "fcoh.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fcoh"]
